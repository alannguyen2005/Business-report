name: Weekly Business Review Email

on:
  schedule:
    # 02:00 UTC = 09:00 giờ Việt Nam, thứ 2 hàng tuần
    # Chạy sau khi Claude Routine phân tích xong (08:00 VN)
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Script tự bỏ qua (exit 0) nếu Routine chưa tạo insights.json tuần này,
      # nên workflow không báo đỏ khi phân tích chưa xong.
      - name: Gửi email + đính kèm report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python send_report.py
